
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f1e8" />

  <title>JSK Frames | AR Memories</title>
  <link rel="stylesheet" href="./style.css" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <header class="brand">
    <div class="brand-mark">JSK</div>
    <div>
      <h1>JSK FRAMES</h1>
      <p>MEMORIES IN MOTION</p>
    </div>
  </header>

  <main class="intro" id="intro">
    <span class="eyebrow">YOUR MEMORIES, REIMAGINED</span>
    <h2>Bring your photo to life.</h2>
    <p>Point your camera at your special photo and watch the memory come alive.</p>

    <div class="camera-note">
      <span class="pulse"></span>
      Tap the camera icon below to begin.
    </div>
  </main>

  <div class="ar-controls" id="arControls">
    <div class="ar-status" id="arStatus" role="status" aria-live="polite">
      Ready when you are.
    </div>

    <button id="soundButton" type="button" disabled>
      🔊 Enable Sound
    </button>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets>
      <video
        id="memoryVideo"
        src="./video/memory.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="photoTarget"
      mindar-image-target="targetIndex: 0"
    >
      <a-video
  id="memoryOverlay"
  src="#memoryVideo"
  width="1"
  height="0.5625"
  position="0 0 0.02"
  rotation="0 0 0"
  material="shader: flat; side: double"
></a-video>
    </a-entity>
  </a-scene>

  <footer class="footer">
    <div class="footer-copy">
      <p>Every picture holds a story.</p>
      <span>Made with care by JSK Frames</span>
    </div>

    <button
      id="startCameraButton"
      type="button"
      aria-label="Start AR camera"
      title="Start AR camera"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9" />
        <path d="m14 4 6-2 2 6-6 2z" />
        <circle cx="10" cy="12" r="3" />
      </svg>
    </button>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
